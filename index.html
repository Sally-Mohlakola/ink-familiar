<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ink Familiar</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="A mirror-symmetric ink creature that morphs over a night scene or your own photo.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@1,6..96,500&family=Martian+Mono:wght@400;500&display=swap">
<style>
/* Layout: one full-bleed stage (scene, creature, cast shadow); a whisper of type at the top; a single control rail pinned to the bottom edge. */
:root{
  --bg:#050606;
  --fg:#ece8df;
  --muted:#a7a397;
  --glass:rgba(9,10,9,.6);
  --line:rgba(236,232,223,.16);
  --lamp:#f2d79c;
  --rec:#e5484d;
  --on-rec:#ffffff;
  --panel:#0e0f0e;
  --display:"Bodoni Moda","Bodoni 72","Didot",Georgia,serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);overflow:hidden;overscroll-behavior:none;font-family:var(--mono);-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:var(--bg);touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
#stage.dragging{cursor:grabbing}
#scene,#bgImg,#bgVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
#shade{position:absolute;left:0;top:0;transform-origin:50% 50%;opacity:.82;filter:blur(1.6px);mix-blend-mode:multiply;pointer-events:none;will-change:transform}
#ink{position:absolute;left:0;top:0;pointer-events:none;will-change:transform}
.ui{position:fixed;left:0;right:0;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{top:0;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 0;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.4rem;line-height:1.1;letter-spacing:.005em;text-shadow:0 1px 14px rgba(0,0,0,.7);text-wrap:balance}
.hint{margin:0;font-size:.58rem;line-height:1.7;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);text-align:right;text-shadow:0 1px 8px rgba(0,0,0,.8);transition:opacity .8s}
.hint.gone{opacity:0}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:8px;min-width:0}
.chip{pointer-events:auto;background:var(--glass);border:1px solid var(--line);min-height:34px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.bottom{bottom:0;padding-block:0 calc(env(safe-area-inset-bottom,0px) + 16px);display:flex;justify-content:center}
.rail{pointer-events:auto;display:flex;flex-wrap:wrap;justify-content:center;gap:2px;padding:5px;border-radius:24px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);max-width:100%}
.btn{appearance:none;border:0;background:transparent;color:var(--fg);font:500 .62rem/1 var(--mono);letter-spacing:.05em;text-transform:uppercase;padding:0 11px;min-height:40px;border-radius:19px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;white-space:nowrap}
.btn:hover{background:rgba(236,232,223,.08)}
.btn:focus-visible{outline:1.5px solid var(--lamp);outline-offset:1px}
.btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.btn svg{width:14px;height:14px;flex:none}
.vh{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;overflow:hidden}
.shutter{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 30px + var(--railh,52px));width:64px;height:64px;padding:0;border-radius:50%;border:3px solid var(--fg);background:rgba(0,0,0,.28);display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 20px rgba(0,0,0,.55)}
.shutter i{display:block;width:46px;height:46px;border-radius:50%;background:var(--rec);transition:width .2s,height .2s,border-radius .2s}
.shutter.on i{width:24px;height:24px;border-radius:6px}
.shutter:focus-visible{outline:2px solid var(--lamp);outline-offset:4px}
.rectime{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 106px + var(--railh,52px));margin:0;padding:5px 10px;border-radius:999px;background:var(--rec);color:var(--on-rec);font:500 .66rem/1 var(--mono);letter-spacing:.08em;font-variant-numeric:tabular-nums;pointer-events:none}
.sheet{position:fixed;inset:0;z-index:5;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.62);padding-block:calc(env(safe-area-inset-top,0px) + 16px) calc(env(safe-area-inset-bottom,0px) + 16px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet-card{width:100%;max-width:420px;display:grid;gap:12px;padding:14px;border-radius:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 10px 50px rgba(0,0,0,.6)}
.sheet-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-width:0}
.sheet-title{margin:0;font-family:var(--display);font-style:italic;font-weight:500;font-size:1.15rem}
.sheet-info{margin:0;font-size:.6rem;letter-spacing:.06em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet video{display:block;width:100%;max-width:100%;max-height:58vh;border-radius:12px;background:#000;object-fit:contain}
.sheet-actions{display:flex;flex-wrap:wrap;gap:6px}
.sheet-actions .btn{border:1px solid var(--line);flex:1 1 auto;justify-content:center}
.sheet-actions .btn.solid{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 76px);transform:translateX(-50%);max-width:min(340px,calc(100% - 32px));padding:10px 14px;border-radius:12px;background:var(--glass);border:1px solid var(--line);font-size:.62rem;line-height:1.6;color:var(--fg);text-align:center;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);pointer-events:none;transition:opacity .5s}
.toast.off{opacity:0}
@media (prefers-reduced-motion: reduce){.hint,.toast{transition:none}}
</style>
</head>
<body>
<div id="stage" aria-label="Ink creature stage. Drag to move, tap to mutate, pinch to resize.">
  <canvas id="scene" aria-hidden="true"></canvas>
  <img id="bgImg" alt="Your backdrop" hidden>
  <video id="bgVid" muted loop playsinline autoplay hidden></video>
  <canvas id="shade" aria-hidden="true"></canvas>
  <canvas id="ink" aria-hidden="true"></canvas>
</div>

<header class="ui top">
  <h1>Ink Familiar</h1>
  <div class="topr">
    <p class="hint" id="hint">Drag to move<br>Tap to mutate<br>Pinch to resize</p>
    <button class="btn chip" id="nightBtn" type="button" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M11.5 10.5A5 5 0 0 1 6 3a5 5 0 1 0 6.9 6.9z"/></svg>Night scene
    </button>
  </div>
</header>

<nav class="ui bottom" aria-label="Controls">
  <div class="rail">
    <label class="btn" for="camInput" tabindex="0" id="camBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2 5.5h2.6L6 3.8h4l1.4 1.7H14v7H2z"/><circle cx="8" cy="8.8" r="2.3"/></svg>Camera
    </label>
    <label class="btn" for="picInput" tabindex="0" id="picBtn">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><rect x="2" y="3" width="12" height="10" rx="1"/><path d="M2.5 11.5l3.5-3.5 3 3 2-2 2.5 2.5"/></svg>Photos
    </label>
    <button class="btn" id="liveBtn" type="button" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="8" r="5.5"/></svg>Live
    </button>
    <button class="btn" id="mutBtn" type="button">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M8 2v12M3 5c2 0 3 1.5 5 3M13 5c-2 0-3 1.5-5 3M3.5 12c1.5-1 3-1.6 4.5-1.6S11 11 12.5 12"/></svg>Mutate
    </button>
    <button class="btn" id="sndBtn" type="button" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M2.5 6h2.5L8.5 3v10L5 10H2.5z"/><path d="M11 5.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5"/></svg><span>Sound</span>
    </button>
  </div>
  <input class="vh" type="file" id="camInput" accept="image/*,video/*" capture="environment">
  <input class="vh" type="file" id="picInput" accept="image/*,video/*">
</nav>

<button class="shutter" id="recBtn" type="button" aria-label="Start recording"><i aria-hidden="true"></i></button>
<p class="rectime" id="recTime" hidden>● 0:00</p>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
  <div class="sheet-card">
    <div class="sheet-head">
      <p class="sheet-title" id="sheetTitle">Your clip</p>
      <p class="sheet-info" id="clipInfo"></p>
    </div>
    <video id="clip" playsinline loop controls></video>
    <div class="sheet-actions">
      <button class="btn solid" id="shareBtn" type="button" hidden>Save to Photos</button>
      <button class="btn" id="dlBtn" type="button">Download</button>
      <button class="btn" id="discardBtn" type="button">Discard</button>
    </div>
  </div>
</div>

<div class="toast off" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const stage = $("stage"), scene = $("scene"), ink = $("ink"), shade = $("shade");
  const bgImg = $("bgImg"), bgVid = $("bgVid"), hint = $("hint"), toastEl = $("toast");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = innerWidth, H = innerHeight;
  const st = { cx: .5, cy: .47, scale: 1, seed: Math.random() * 20, seedTarget: 0, t: 0, pulse: .3, boost: 0 };
  st.seedTarget = st.seed;

  let toastTimer;
  function toast(msg, ms = 3200) {
    toastEl.textContent = msg; toastEl.classList.remove("off");
    clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.add("off"), ms);
  }

  /* ---------- Night scene, painted once per resize ---------- */
  function rng(seed) { let s = seed >>> 0 || 1; return () => (s = (s * 16807) % 2147483647) / 2147483647; }
  function drawScene() {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    const w = Math.round(W * dpr), h = Math.round(H * dpr);
    scene.width = w; scene.height = h;
    const c = scene.getContext("2d"), r = rng(9173), s = Math.min(w, h * .6) / 400;
    const hz = h * .43, vpx = w * .5;
    const lamp = { x: w * .16, y: h * .07 };

    c.fillStyle = "#030404"; c.fillRect(0, 0, w, h);
    let g = c.createLinearGradient(0, 0, 0, hz);
    g.addColorStop(0, "#020303"); g.addColorStop(1, "#0a0d0b");
    c.fillStyle = g; c.fillRect(0, 0, w, hz + 2);

    // tree trunks at the horizon
    for (let i = 0; i < 14; i++) {
      const x = r() * w, tw = (3 + r() * 7) * s;
      c.fillStyle = "#040504"; c.fillRect(x, hz - h * (.06 + r() * .1), tw, h * .14);
    }
    // canopy
    for (let i = 0; i < 520; i++) {
      const x = r() * w * 1.1 - w * .05, y = Math.pow(r(), 1.3) * hz * 1.02 - h * .03;
      const rad = (14 + r() * 46) * s;
      const d = Math.hypot(x - lamp.x, y - lamp.y) / (w * .55);
      const lit = Math.max(0, 1 - d);
      const gch = 9 + r() * 10 + lit * 30, rch = 4 + lit * 16, bch = 6 + lit * 6;
      c.fillStyle = `rgba(${rch|0},${gch|0},${bch|0},${.3 + r() * .3})`;
      c.beginPath(); c.arc(x, y, rad, 0, 7); c.fill();
    }
    // a bright clump of leaves lit by a distant lamp
    const far = { x: w * .38, y: h * .3 };
    for (let i = 0; i < 70; i++) {
      const a = r() * 7, d = Math.pow(r(), .6) * 26 * s;
      c.fillStyle = `rgba(${70 + r() * 40|0},${120 + r() * 50|0},${40 + r() * 20|0},${.25 + r() * .45})`;
      c.beginPath(); c.arc(far.x + Math.cos(a) * d, far.y + Math.sin(a) * d * .8, (2 + r() * 6) * s, 0, 7); c.fill();
    }
    // distant lamps
    [[w * .42, h * .27, 1], [w * .58, h * .39, .7], [w * .66, h * .41, .5], [w * .3, h * .42, .45]].forEach(([x, y, k]) => {
      const gg = c.createRadialGradient(x, y, 0, x, y, 28 * s * k);
      gg.addColorStop(0, "rgba(255,236,200,.9)"); gg.addColorStop(.15, "rgba(255,220,160,.35)"); gg.addColorStop(1, "rgba(255,210,150,0)");
      c.fillStyle = gg; c.beginPath(); c.arc(x, y, 28 * s * k, 0, 7); c.fill();
    });

    // ground geometry
    const L0 = [vpx - w * .015, hz], R0 = [vpx + w * .035, hz], L1 = [w * .12, h], R1 = [w * 1.14, h];
    // gravel strip on the left
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, "#0d0d0c"); g.addColorStop(1, "#3b3a37");
    c.fillStyle = g; c.beginPath(); c.moveTo(0, hz); c.lineTo(L0[0], hz); c.lineTo(L1[0], h); c.lineTo(0, h); c.fill();
    for (let i = 0; i < 2600; i++) {
      const y = hz + Math.pow(r(), .7) * (h - hz), f = (y - hz) / (h - hz);
      const xr = L0[0] + (L1[0] - L0[0]) * f, x = r() * xr;
      c.fillStyle = `rgba(${r() < .5 ? "210,205,195" : "0,0,0"},${.05 + f * .18})`;
      c.fillRect(x, y, (.6 + f * 1.8) * s, (.6 + f * 1.4) * s);
    }
    // grass on the right
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, "#050c06"); g.addColorStop(1, "#14301a");
    c.fillStyle = g; c.beginPath(); c.moveTo(R0[0], hz); c.lineTo(w, hz); c.lineTo(w, h); c.lineTo(R1[0], h); c.fill();
    for (let i = 0; i < 900; i++) {
      const y = hz + Math.pow(r(), .8) * (h - hz), f = (y - hz) / (h - hz);
      const xl = R0[0] + (R1[0] - R0[0]) * f; const x = xl + r() * (w - xl);
      c.strokeStyle = `rgba(${40 + r() * 40|0},${80 + r() * 60|0},${30 + r() * 20|0},${.08 + f * .25})`;
      c.lineWidth = (.5 + f) * s; c.beginPath(); c.moveTo(x, y); c.lineTo(x + (r() - .5) * 3 * s, y - (2 + f * 8) * s); c.stroke();
    }
    // paving
    c.save();
    c.beginPath(); c.moveTo(...L0); c.lineTo(...R0); c.lineTo(...R1); c.lineTo(...L1); c.closePath(); c.clip();
    g = c.createLinearGradient(0, hz, 0, h);
    g.addColorStop(0, "#1c1712"); g.addColorStop(.5, "#5a4a37"); g.addColorStop(1, "#8a7255");
    c.fillStyle = g; c.fillRect(0, hz, w, h - hz);
    // lamp pool
    g = c.createRadialGradient(w * .32, h * .78, 0, w * .32, h * .78, w * .95);
    g.addColorStop(0, "rgba(255,200,130,.3)"); g.addColorStop(1, "rgba(255,196,120,0)");
    c.fillStyle = g; c.fillRect(0, hz, w, h - hz);
    // bricks in perspective
    const rows = 34, cols = 6;
    const edgeX = (P, Q, y) => P[0] + (Q[0] - P[0]) * ((y - P[1]) / (Q[1] - P[1]));
    let prevY = hz;
    for (let i = 1; i <= rows; i++) {
      const f = Math.pow(i / rows, 2.1), y = hz + (h - hz) * f;
      c.strokeStyle = `rgba(0,0,0,${.25 + f * .3})`; c.lineWidth = (.4 + f * 2.2) * s;
      c.beginPath(); c.moveTo(0, y); c.lineTo(w, y); c.stroke();
      const ym = (y + prevY) / 2, xl = edgeX(L0, L1, ym), xr = edgeX(R0, R1, ym);
      for (let j = 0; j <= cols; j++) {
        const u = (j + (i % 2) * .5) / cols; if (u > 1) continue;
        const xa = edgeX(L0, L1, prevY) + (edgeX(R0, R1, prevY) - edgeX(L0, L1, prevY)) * u;
        const xb = edgeX(L0, L1, y) + (edgeX(R0, R1, y) - edgeX(L0, L1, y)) * u;
        c.beginPath(); c.moveTo(xa, prevY); c.lineTo(xb, y); c.stroke();
      }
      // a few tiles slightly lighter
      if (f > .15) for (let j = 0; j < cols; j++) if (r() < .25) {
        const u0 = (j + (i % 2) * .5) / cols, u1 = u0 + 1 / cols;
        const xa0 = xl + (xr - xl) * Math.min(u0, 1), xa1 = xl + (xr - xl) * Math.min(u1, 1);
        c.fillStyle = `rgba(255,220,170,${.02 + r() * .04})`; c.fillRect(xa0, prevY, xa1 - xa0, y - prevY);
      }
      prevY = y;
    }
    // kerb line
    c.restore();
    c.strokeStyle = "rgba(120,110,95,.5)"; c.lineWidth = 2 * s;
    c.beginPath(); c.moveTo(...L0); c.lineTo(...L1); c.stroke();

    // lamp post and its light
    c.fillStyle = "#070706";
    c.fillRect(lamp.x - 2.5 * s, lamp.y, 5 * s, h * .52);
    c.fillRect(lamp.x - 8 * s, lamp.y + h * .45, 16 * s, h * .07);
    g = c.createRadialGradient(lamp.x, lamp.y, 0, lamp.x, lamp.y, w * .55);
    g.addColorStop(0, "rgba(255,228,170,.42)"); g.addColorStop(.12, "rgba(255,214,150,.16)"); g.addColorStop(1, "rgba(255,214,150,0)");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    c.fillStyle = "#fff5dc"; c.beginPath(); c.ellipse(lamp.x, lamp.y, 13 * s, 10 * s, 0, 0, 7); c.fill();

    // vignette and grain
    g = c.createRadialGradient(w * .5, h * .5, Math.min(w, h) * .25, w * .5, h * .5, Math.hypot(w, h) * .62);
    g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.6)");
    c.fillStyle = g; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 9000; i++) { c.fillStyle = `rgba(255,255,255,${r() * .035})`; c.fillRect(r() * w, r() * h, 1, 1); }
  }

  /* ---------- The ink creature (WebGL) ---------- */
  const gl = ink.getContext("webgl", { premultipliedAlpha: true, alpha: true, antialias: false, preserveDrawingBuffer: true });
  const sctx = shade.getContext("2d");
  let prog, U = {};
  const VS = "attribute vec2 a;varying vec2 v;void main(){v=a*.5+.5;gl_Position=vec4(a,0.,1.);}";
  const FS = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
varying vec2 v;
uniform float uT, uSeed, uPulse;
vec3 mod289(vec3 x){return x-floor(x*(1./289.))*289.;}
vec4 mod289(vec4 x){return x-floor(x*(1./289.))*289.;}
vec4 permute(vec4 x){return mod289(((x*34.)+1.)*x);}
vec4 tis(vec4 r){return 1.79284291400159-.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1./6.,1./3.);const vec4 D=vec4(0.,.5,1.,2.);
  vec3 i=floor(v+dot(v,C.yyy));vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);vec3 l=1.-g;vec3 i1=min(g.xyz,l.zxy);vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;vec3 x2=x0-i2+C.yyy;vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.,i1.z,i2.z,1.))+i.y+vec4(0.,i1.y,i2.y,1.))+i.x+vec4(0.,i1.x,i2.x,1.));
  float n_=.142857142857;vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.*floor(p*ns.z*ns.z);vec4 x_=floor(j*ns.z);vec4 y_=floor(j-7.*x_);
  vec4 x=x_*ns.x+ns.yyyy;vec4 y=y_*ns.x+ns.yyyy;vec4 h=1.-abs(x)-abs(y);

    clip.play().catch(() => {});
    $("dlBtn").focus({ preventScroll: true });
  }
  function closeSheet() {
    sheet.hidden = true; recBtn.hidden = !canRecord;
    clip.pause(); clip.removeAttribute("src"); clip.load();
  }
  let dlP = null;
  const getDownloads = () => dlP || (dlP = (window.claude && window.claude.use) ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null));
  if (framed) setTimeout(getDownloads, 0);
  async function downloadClip() {
    if (!clipBlob) return;
    if (framed) {
      const dl = await getDownloads();
      if (!dl) { toast("Saving files isn't available here. Use the GitHub Pages version to download clips."); return; }
      try { await dl.save({ filename: clipName, data: clipBlob }); toast("Saved " + clipName, 2400); }
      catch (e) {
        const code = e && e.code;
        if (code === "declined") return;
        toast(code === "rate_limited" ? "A save is already waiting for you to confirm." : "This view can't save the video. Use the GitHub Pages version instead.");
      }
      return;
    }
    const a = document.createElement("a");
    a.href = clipURL; a.download = clipName; a.rel = "noopener";
    document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1500);
    toast("Downloading " + clipName, 2400);
  }
  async function shareClip() {
    if (!clipBlob) return;
    const file = new File([clipBlob], clipName, { type: clipBlob.type });
    try { await navigator.share({ files: [file], title: "Ink Familiar" }); }
    catch (e) { if (!e || e.name !== "AbortError") downloadClip(); }
  }
  recBtn.addEventListener("click", () => { if (rec) stopRec(); else startRec(); });
  $("dlBtn").addEventListener("click", downloadClip);
  $("shareBtn").addEventListener("click", shareClip);
  $("discardBtn").addEventListener("click", closeSheet);
  sheet.addEventListener("click", e => { if (e.target === sheet) closeSheet(); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !sheet.hidden) closeSheet(); });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) { running = false; if (rec) stopRec(); }
    else if (!running) { running = true; last = performance.now(); requestAnimationFrame(frame); }
  });

  drawScene();
  try {
    if (!initGL()) throw new Error("no webgl");
    requestAnimationFrame(frame);
  } catch (e) {
    toast("This browser can't draw WebGL, so the creature can't appear here.", 8000);
  }
})();
</script>
</body>
</html>
